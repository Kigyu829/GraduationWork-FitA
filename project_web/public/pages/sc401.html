<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식단 사진 업로드</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sc101.css" />
  <link rel="stylesheet" href="../css/drawer.css" />
  <link rel="stylesheet" href="../css/sc401.css" />
</head>
<body>

  <!-- ── 네비게이션 바 ── -->
  <nav class="navbar">
    <div class="nav-inner">
      <button class="drawer-toggle-nav" id="drawerToggle" title="메뉴">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <a href="sc301.html" class="site-logo" id="navLogo">
        <div class="site-logo-icon"><img src="../img/logo1.png" alt="FitA" style="width:100%;height:100%;object-fit:contain;border-radius:6px;" /></div>
        <span class="site-logo-text">FitA</span>
      </a>
    </div>
  </nav>

  <!-- 사이드바 드로어 -->
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo" id="drawerLogo" style="cursor:pointer;">
        <div class="drawer-logo-icon"><img src="../img/logo1.png" alt="FitA" style="width:100%;height:100%;object-fit:contain;border-radius:6px;" /></div>
        <span class="drawer-logo-text">FitA</span>
      </div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-menu-btn" data-href="sc301.html"><span>🏠</span>대시보드</button>
      <button class="drawer-menu-btn" data-href="sc302.html"><span>🤖</span>AI 식단 추천</button>
      <button class="drawer-menu-btn" data-href="sc311.html"><span>💪</span>오늘의 식단/운동</button>
      <button class="drawer-menu-btn active" data-href="sc401.html"><span>🥗</span>식단 인증</button>
      <button class="drawer-menu-btn" data-href="sc602.html"><span>📅</span>히스토리</button>
      <button class="drawer-menu-btn" data-href="sc701.html"><span>⚙️</span>마이페이지</button>
    </nav>
    <button class="drawer-logout" id="drawerLogout">로그아웃</button>
  </aside>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="upload-main">

    <div class="upload-header">
      <div class="upload-header-inner">
        <button class="header-close-btn" id="backToMain" title="돌아가기">✕</button>
        <div>
          <div class="upload-title">식단 사진 업로드</div>
          <div class="upload-sub">오늘 먹은 음식 사진을 업로드하면 AI가 분석해드려요</div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════
         끼니 선택 (직접 진입 시만 표시)
         sc401.js에서 display 제어
         ══════════════════════════════ -->
    <div class="meal-selector" id="mealSelector" style="display:none;">
      <div class="meal-selector-inner">
        <div class="selector-label">🍽️ 어느 끼니를 인증할까요?</div>
        <div class="meal-select-btns">
          <button class="meal-select-btn" data-meal="breakfast">
            <span class="msb-icon">🌅</span>
            <span class="msb-label">아침</span>
          </button>
          <button class="meal-select-btn" data-meal="lunch">
            <span class="msb-icon">☀️</span>
            <span class="msb-label">점심</span>
          </button>
          <button class="meal-select-btn" data-meal="dinner">
            <span class="msb-icon">🌙</span>
            <span class="msb-label">저녁</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 업로드 카드 -->
    <div class="upload-card">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" />
        <div class="upload-zone-inner" id="uploadZoneInner">
          <div class="upload-icon">📁</div>
          <div class="upload-label">사진을 여기에 드래그하거나</div>
          <button class="upload-btn primary-btn" id="uploadBtn">파일 선택하기</button>
          <div class="upload-hint">JPG, PNG, WEBP · 최대 10MB</div>
        </div>
        <div class="upload-preview" id="uploadPreview" style="display:none;">
          <img class="preview-img" id="previewImg" src="" alt="미리보기" />
          <div class="preview-overlay">
            <span class="preview-change-hint">클릭해서 사진 변경</span>
          </div>
        </div>
      </div>

      <div class="upload-actions" id="uploadActions" style="display:none;">
        <div class="selected-info" id="selectedInfo"></div>
        <div class="action-btns">
          <button class="secondary-btn" id="cancelBtn">다시 선택</button>
          <button class="primary-btn analyze-btn" id="analyzeBtn">🔍 AI 분석 시작</button>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/common.js"></script>
  <script src="../js/drawer.js"></script>
  <script src="../js/sc401.js"></script>
</body>
</html>
