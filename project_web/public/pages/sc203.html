<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>목표 설정 – HealthDash</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sc203.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="health-page">
  <div class="health-container">
    <div style="width:100%; max-width:520px;">

      <!-- 스텝 바 -->
      <div class="step-bar">
        <div class="step-item done">
          <div class="step-circle">✓</div>
          <span class="step-label">신체 정보</span>
        </div>
        <div class="step-line done"></div>
        <div class="step-item active">
          <div class="step-circle">2</div>
          <span class="step-label">목표 설정</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step-circle">✓</div>
          <span class="step-label">완료</span>
        </div>
      </div>

      <section class="form-card">
        <div class="form-header">
          <span class="step-badge">STEP 2 / 2</span>
          <h1>목표를 설정해주세요</h1>
          <p>목표 감량 무게와 달성 기간을 입력해주세요.</p>
        </div>

        <form id="bodyInfoForm2" class="health-form">

          <div class="input-group">
            <label for="activityLevel">평소 활동량</label>
            <select id="activityLevel" name="activity" required>
              <option value="">선택하세요</option>
              <option value="낮음">낮음 — 주로 앉아서 생활</option>
              <option value="보통">보통 — 주 1~3회 가벼운 운동</option>
              <option value="높음">높음 — 주 3~5회 규칙적 운동</option>
              <option value="매우높음">매우 높음 — 주 6~7회 고강도 운동</option>
              <option value="선수">운동 선수 — 하루 2회 훈련 또는 육체 노동</option>
            </select>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label for="targetLoss">목표 감량 (kg)</label>
              <input type="number" id="targetLoss" name="targetLoss"
                placeholder="예: 5" min="1" step="0.1" required />
            </div>
            <div class="input-group">
              <label for="goalPeriod">달성 기간</label>
              <select id="goalPeriod" name="goalPeriod" required>
                <option value="">선택하세요</option>
                <option value="4주">4주</option>
                <option value="8주">8주</option>
                <option value="12주">12주</option>
                <option value="16주">16주</option>
                <option value="기타">기타 (직접 입력)</option>
              </select>
              <!-- 기타 선택 시 표시 -->
              <div id="customPeriodWrap" style="display:none; margin-top:6px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <input type="number" id="customPeriodWeeks"
                    placeholder="주 수 입력" min="1" max="52"
                    style="flex:1;" />
                  <span style="font-size:13px; color:var(--text-sec); white-space:nowrap;">주</span>
                </div>
                <span class="field-hint" id="customPeriodHint"></span>
              </div>
            </div>
          </div>

          <!-- BMI 카드 -->
          <div class="bmi-preview">
            <div class="bmi-box">
              <div class="bmi-left">
                <span class="bmi-label">현재 BMI</span>
                <strong id="bmiValue">-</strong>
              </div>
              <div class="bmi-divider"></div>
              <div class="bmi-right">
                <p id="bmiStatus">이전 단계 정보를 불러오는 중입니다.</p>
              </div>
            </div>
          </div>

          <!-- 목표 프리뷰 -->
          <div class="goal-preview">
            <p class="info-text muted" id="goalInfo">목표 감량과 기간을 입력하면 목표가 표시됩니다.</p>
          </div>

          <!-- 과도한 목표 경고 (sc203.js에서 show 클래스 토글) -->
          <div class="goal-warning" id="goalWarning"></div>

          <div class="form-actions">
            <a href="sc202.html" class="secondary-btn">← 이전</a>
            <button type="submit" class="primary-btn">완료하기</button>
          </div>

        </form>
      </section>

    </div>
  </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
<script src="../js/common.js"></script>
  <script src="../js/sc203.js"></script>
</body>
</html>
