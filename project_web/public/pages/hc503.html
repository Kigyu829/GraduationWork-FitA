<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 플랜 확인 – HealthDash</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sc301.css" />
  <link rel="stylesheet" href="../css/hc503.css" />
</head>
<body>
<div class="dashboard hc503-dashboard">

  <!-- ── 좌측 사이드바 ── -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo" id="sidebarLogo" style="cursor:pointer;">
        <div class="sidebar-logo-icon">🏃</div>
        <span class="sidebar-logo-text">HealthDash</span>
      </div>

      <div class="sidebar-card profile-card">
        <div class="profile-avatar">👤</div>
        <div id="userName">내 정보</div>
        <div id="userBasicInfo">불러오는 중...</div>
        <div class="profile-weights">
          <div class="weight-chip">
            <span class="weight-chip-label">현재 체중</span>
            <span class="weight-chip-value" id="currentWeightText">-</span>
          </div>
          <div class="weight-chip">
            <span class="weight-chip-label">목표 체중</span>
            <span class="weight-chip-value" id="targetWeightText">-</span>
          </div>
        </div>
      </div>

      <div class="sidebar-card menu-card">
        <div class="menu-card-title">메뉴</div>
        <div class="menu-list">
          <button class="menu-btn" data-href="sc301.html"><span class="menu-btn-icon">🏠</span>대시보드</button>
          <button class="menu-btn" data-href="sc302.html"><span class="menu-btn-icon">🤖</span>AI 식단 추천</button>
          <button class="menu-btn active" data-href="sc311.html"><span class="menu-btn-icon">💪</span>오늘의 식단/운동</button>
          <button class="menu-btn" data-href="sc401.html"><span class="menu-btn-icon">🥗</span>식단 인증</button>
          <button class="menu-btn" data-href="sc601.html"><span class="menu-btn-icon">📅</span>히스토리(달력)</button>
          <button class="menu-btn" data-href="sc701.html"><span class="menu-btn-icon">👤</span>마이페이지</button>
        </div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </aside>

  <!-- ── 메인 ── -->
  <main class="hc503-main">

    <!-- 상단 헤더 -->
    <div class="hc503-page-header">
      <div class="hc503-header-left">
        <div class="hc503-page-title">🤖 AI 플랜 확인</div>
        <div class="hc503-page-sub">생성된 식단과 운동 플랜을 확인하고 의견을 알려주세요</div>
      </div>
      <!-- 별로예요 버튼 클릭 시 AI 상담 토글 -->
      <button class="hc503-chat-toggle-btn" id="hc503ChatToggleBtn" style="display:none;">
        🤖 AI 상담
      </button>
    </div>

    <!-- 플랜 + 채팅 레이아웃 -->
    <div class="hc503-body">

      <!-- 중앙: 플랜 카드들 (세로 배치) -->
      <div class="hc503-plans" id="hc503Plans">

        <!-- 식단 플랜 카드 -->
        <div class="hc503-card">
          <div class="hc503-card-header">
            <span class="hc503-card-icon">🥗</span>
            <span class="hc503-card-title">식단 플랜</span>
            <span class="hc503-card-badge" id="mealPlanBadge">AI 추천</span>
          </div>

          <!-- 비교 뷰 (재생성 후) -->
          <div class="hc503-compare" id="mealCompare" style="display:none;">
            <div class="hc503-compare-col old">
              <div class="hc503-compare-label">📌 기존 플랜</div>
              <div id="mealOldContent"></div>
            </div>
            <div class="hc503-compare-arrow">→</div>
            <div class="hc503-compare-col new">
              <div class="hc503-compare-label">✨ 새 플랜</div>
              <div id="mealNewContent"></div>
            </div>
          </div>

          <!-- 일반 뷰 -->
          <div id="mealPlanContent">
            <div class="hc503-meal-grid" id="mealGrid"></div>
            <div class="hc503-plan-total" id="mealTotal"></div>
            <div class="hc503-plan-tip"   id="mealTip"></div>
          </div>
        </div>

        <!-- 운동 플랜 카드 -->
        <div class="hc503-card">
          <div class="hc503-card-header">
            <span class="hc503-card-icon">💪</span>
            <span class="hc503-card-title">운동 플랜</span>
            <span class="hc503-card-badge" id="workoutPlanBadge">AI 추천</span>
          </div>

          <!-- 비교 뷰 (재생성 후) -->
          <div class="hc503-compare" id="workoutCompare" style="display:none;">
            <div class="hc503-compare-col old">
              <div class="hc503-compare-label">📌 기존 플랜</div>
              <div id="workoutOldContent"></div>
            </div>
            <div class="hc503-compare-arrow">→</div>
            <div class="hc503-compare-col new">
              <div class="hc503-compare-label">✨ 새 플랜</div>
              <div id="workoutNewContent"></div>
            </div>
          </div>

          <!-- 일반 뷰 -->
          <div id="workoutPlanContent">
            <div class="hc503-workout-list" id="workoutList"></div>
            <div class="hc503-plan-total"   id="workoutTotal"></div>
            <div class="hc503-plan-tip"     id="workoutTip"></div>
          </div>
        </div>

        <!-- 하단 판단 버튼 -->
        <div class="hc503-actions" id="hc503Actions">
          <button class="hc503-btn-ok"  id="hc503OkBtn">👍 괜찮아요, 이대로 진행할게요</button>
          <button class="hc503-btn-bad" id="hc503BadBtn">👎 별로예요, 수정해주세요</button>
        </div>

      </div><!-- /hc503-plans -->

      <!-- 우측: AI 채팅 사이드패널 -->
      <aside class="hc503-chat-panel" id="hc503ChatPanel">
        <div class="hc503-chat-header">
          <div class="hc503-chat-title-wrap">
            <span class="hc503-chat-title">🤖 AI 상담사</span>
            <span class="hc503-chat-sub">어떤 부분이 마음에 들지 않으셨나요?</span>
          </div>
          <button class="hc503-chat-close" id="hc503ChatClose">×</button>
        </div>

        <div class="hc503-chat-messages" id="hc503ChatMessages">
          <div class="hc503-msg ai">
            <div class="hc503-avatar">🤖</div>
            <div>
              <div class="hc503-bubble">플랜에서 불편하신 부분을 알려주시면 바로 수정해드릴게요!<br>예) "저녁이 너무 많아요", "운동이 너무 힘들어요"</div>
            </div>
          </div>
        </div>

        <div class="hc503-chat-input-wrap">
          <textarea class="hc503-input" id="hc503Input"
            placeholder="불편한 점을 입력해주세요..." rows="1"></textarea>
          <button class="hc503-send-btn" id="hc503SendBtn">➤</button>
        </div>
      </aside>

    </div><!-- /hc503-body -->

  </main>
</div>

<!-- 재생성 로딩 오버레이 -->
<div class="hc503-loading-overlay" id="hc503LoadingOverlay">
  <div class="hc503-loading-box">
    <div class="hc503-loading-icon">🤖</div>
    <div class="hc503-loading-title" id="hc503LoadingTitle">플랜을 수정하고 있어요...</div>
    <div class="hc503-loading-sub">잠시만 기다려주세요</div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/hc503.js"></script>
</body>
</html>
