<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자세 분석 – FitA</title>
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Noto Sans KR', sans-serif; }

    .pose-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .pose-header a { color: #66D0BC; text-decoration: none; font-size: 20px; }
    .pose-header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .exercise-badge {
      margin-left: auto;
      background: #1a4466; color: #66D0BC;
      border-radius: 20px; padding: 4px 14px;
      font-size: 13px; font-weight: 700;
    }

    .pose-main {
      display: flex; gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 카메라 영역 */
    .camera-section { flex: 1; min-width: 0; }
    .camera-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 4/3;
    }
    #videoEl {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    #poseCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
    }

    /* 자세 정확도 진행 바 */
    .pose-progress-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.5);
      padding: 8px 14px;
    }
    .pose-progress-label {
      font-size: 12px; color: #ccc; margin-bottom: 4px;
    }
    .pose-progress-bar {
      height: 6px; background: #333; border-radius: 3px; overflow: hidden;
    }
    .pose-progress-fill {
      height: 100%; width: 0%; background: #66D0BC;
      border-radius: 3px; transition: width .1s linear;
    }

    /* 성공 오버레이 */
    .success-overlay {
      position: absolute; inset: 0;
      background: rgba(0,200,120,.18);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      border-radius: 12px;
    }
    .success-overlay.show { opacity: 1; }
    .success-icon  { font-size: 56px; margin-bottom: 8px; }
    .success-text  { font-size: 22px; font-weight: 800; color: #00e096; text-shadow: 0 2px 10px rgba(0,0,0,.6); }

    .camera-controls {
      display: flex; gap: 10px;
      margin-top: 12px;
    }
    .btn-primary {
      flex: 1; padding: 12px;
      background: #66D0BC; color: #0a0a0a;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-secondary {
      flex: 1; padding: 12px;
      background: #2a2a2a; color: #ccc;
      border: none; border-radius: 8px;
      font-size: 15px; cursor: pointer;
    }
    .btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; }

    .status-bar {
      margin-top: 10px; padding: 10px 14px;
      background: #1a1a1a; border-radius: 8px;
      font-size: 14px; color: #ccc;
    }
    .status-bar.detected { color: #66D0BC; }
    .status-bar.correct  { color: #00e096; font-weight: 700; }
    .status-bar.error    { color: #ff5555; }

    /* 오른쪽 패널 */
    .info-section { width: 300px; flex-shrink: 0; }
    .info-card {
      background: #1a1a1a; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .info-card h2 { margin: 0 0 10px; font-size: 15px; color: #66D0BC; }
    .info-card p  { margin: 0 0 6px; font-size: 13px; color: #bbb; line-height: 1.5; }

    .angle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 13px;
    }
    .angle-row:last-child { border-bottom: none; }
    .angle-label { color: #bbb; }
    .angle-value { font-weight: 700; color: #66D0BC; font-size: 15px; }
    .angle-value.ok { color: #00e096; }
    .angle-fix {
      font-size: 11px; color: #ff8855;
      padding: 0 0 6px 0; line-height: 1.4;
    }

    .landmark-count {
      font-size: 28px; font-weight: 800;
      color: #66D0BC; text-align: center; margin: 8px 0;
    }

    @media (max-width: 768px) {
      .pose-main { flex-direction: column; }
      .info-section { width: 100%; }
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div class="pose-header">
  <a href="sc311.html">←</a>

<div class="pose-main">

  <!-- 정보 패널 -->
  <div class="info-section">

      <div id="angleDisplay">

      </div>

    <div class="info-card">
      <h2>📊 감지 상태</h2>

    </div>

    <div class="info-card">
      <h2 id="modelStatus">💡 사용 방법</h2>
      <p>1. <strong>분석 시작</strong>을 누르세요.</p>
      <p>2. 카메라 앞에 전신이 보이도록 서주세요.</p>
      <p>3. 올바른 자세로 <strong id="instrText">3회 반복</strong>하면 확인됩니다.</p>
    </div>

  </div>
</div>

<!-- MediaPipe Tasks Vision (CDN) -->
<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils,
} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* ── URL 파라미터에서 운동 이름 읽기 ── */
const params       = new URLSearchParams(location.search);
const exerciseName = params.get('exercise') || '스쿼트';
document.getElementById('exerciseBadge').textContent = exerciseName;

/* ── DOM ── */
const videoEl        = document.getElementById('videoEl');
const canvas         = document.getElementById('poseCanvas');
const ctx            = canvas.getContext('2d');
const btnStart       = document.getElementById('btnStart');
const btnStop        = document.getElementById('btnStop');
const statusBar      = document.getElementById('statusBar');
const modelStatus    = document.getElementById('modelStatus');
const landmarkCount  = document.getElementById('landmarkCount');
const angleDisplay   = document.getElementById('angleDisplay');
const progressWrap   = document.getElementById('progressWrap');
const progressFill   = document.getElementById('progressFill');
const progressLabel  = document.getElementById('progressLabel');
const successOverlay = document.getElementById('successOverlay');

let poseLandmarker = null;
let drawingUtils   = null;
let animId         = null;
let lastVideoTime  = -1;

/* 자세 확인 카운터 (30프레임 ≈ 1초 유지, 홀드 운동용) */
const CONFIRM_FRAMES = 30;
let correctFrames    = 0;
let successShown     = false;

/* 렙 카운팅 */
const REQUIRED_REPS = 3;
let repCount = 0;
let repPhase = 'up'; // 'up'=시작자세 | 'down'=운동자세

/* 4.6.4 측정용 임시 로깅 */
const _frameLatencies = [];
const _holdDurations  = [];
let _holdStartTime = null;
let _repStartTime  = null;
const _repDurations   = [];

/* ── 각도 계산 (세 랜드마크 사이 각도, b가 꼭짓점) ── */
function calcAngle(a, b, c) {
  const abx = a.x - b.x, aby = a.y - b.y;
  const cbx = c.x - b.x, cby = c.y - b.y;
  const dot   = abx * cbx + aby * cby;
  const cross = Math.abs(abx * cby - aby * cbx);
  return Math.round(Math.atan2(cross, dot) * 180 / Math.PI);
}

/* ── 운동별 자세 검증 규칙 ── */
/*
  MediaPipe 랜드마크 인덱스 (주요):
  11=왼어깨, 12=오른어깨, 13=왼팔꿈치, 14=오른팔꿈치
  15=왼손목, 16=오른손목, 23=왼엉덩이, 24=오른엉덩이
  25=왼무릎, 26=오른무릎, 27=왼발목, 28=오른발목
*/
const POSE_RULES = {
  '스쿼트': {
    check: (lms) => {
      const lk = calcAngle(lms[23], lms[25], lms[27]);
      const rk = calcAngle(lms[24], lms[26], lms[28]);
      return { ok: lk < 110 && rk < 110, angles: [
        { label: '왼쪽 무릎', value: lk, ok: lk < 110, fix: '왼쪽 무릎을 더 깊이 구부려 앉으세요' },
        { label: '오른쪽 무릎', value: rk, ok: rk < 110, fix: '오른쪽 무릎을 더 깊이 구부려 앉으세요' },
      ]};
    },
    hint: '무릎을 구부려 앉는 자세를 취해주세요',
  },
  '점프 스쿼트': {
    check: (lms) => {
      const lk = calcAngle(lms[23], lms[25], lms[27]);
      const rk = calcAngle(lms[24], lms[26], lms[28]);
      return { ok: lk < 110 && rk < 110, angles: [
        { label: '왼쪽 무릎', value: lk, ok: lk < 110, fix: '왼쪽 무릎을 더 깊이 구부려 앉으세요' },
        { label: '오른쪽 무릎', value: rk, ok: rk < 110, fix: '오른쪽 무릎을 더 깊이 구부려 앉으세요' },
      ]};
    },
    hint: '스쿼트 자세로 앉아주세요',
  },
  '팔굽혀펴기': {
    check: (lms) => {
      const le = calcAngle(lms[11], lms[13], lms[15]);
      const re = calcAngle(lms[12], lms[14], lms[16]);
      const flat = Math.abs(lms[11].y - lms[23].y) < 0.18;
      const ok = (le < 110 || re < 110) && flat;
      return { ok, angles: [
        { label: '왼쪽 팔꿈치', value: le, ok: le < 110, fix: '왼팔을 더 구부려 가슴이 바닥에 가까워지게 하세요' },
        { label: '오른쪽 팔꿈치', value: re, ok: re < 110, fix: '오른팔을 더 구부려 가슴이 바닥에 가까워지게 하세요' },
        { label: '몸통 수평', value: null, ok: flat, fix: '엉덩이를 내려 머리·등·발이 일직선이 되게 하세요' },
      ]};
    },
    hint: '엎드려 팔을 구부리는 자세를 취해주세요',
  },
  '팔굽혀펴기 (무릎)': {
    check: (lms) => {
      const le = calcAngle(lms[11], lms[13], lms[15]);
      const re = calcAngle(lms[12], lms[14], lms[16]);
      const ok = le < 110 || re < 110;
      return { ok, angles: [
        { label: '왼쪽 팔꿈치', value: le, ok: le < 110, fix: '왼팔을 더 구부리세요' },
        { label: '오른쪽 팔꿈치', value: re, ok: re < 110, fix: '오른팔을 더 구부리세요' },
      ]};
    },
    hint: '무릎을 대고 엎드려 팔을 구부리세요',
  },
  '플랭크': {
    check: (lms) => {
      const flat = Math.abs(lms[11].y - lms[23].y) < 0.12
                && Math.abs(lms[23].y - lms[27].y) < 0.15;
      const le = calcAngle(lms[11], lms[13], lms[15]);
      const re = calcAngle(lms[12], lms[14], lms[16]);
      const armsOk = le > 140 && re > 140;
      return { ok: flat && armsOk, angles: [
        { label: '왼쪽 팔꿈치', value: le, ok: le > 140, fix: '왼팔을 더 펴세요 (팔꿈치 잠금)' },
        { label: '오른쪽 팔꿈치', value: re, ok: re > 140, fix: '오른팔을 더 펴세요 (팔꿈치 잠금)' },
        { label: '몸통 수평', value: null, ok: flat, fix: '엉덩이를 올려 머리·등·발을 일직선으로 유지하세요' },
      ]};
    },
    hint: '엎드려 팔을 펴고 몸을 일직선으로 유지해주세요',
  },
  '런지': {
    check: (lms) => {
      const lk = calcAngle(lms[23], lms[25], lms[27]);
      const rk = calcAngle(lms[24], lms[26], lms[28]);
      const ok = (lk < 110 && rk > 110) || (rk < 110 && lk > 110);
      return { ok, angles: [
        { label: '앞쪽 무릎', value: Math.min(lk, rk), ok: Math.min(lk, rk) < 110, fix: '앞 무릎을 90° 가깝게 더 구부리세요' },
        { label: '뒤쪽 무릎', value: Math.max(lk, rk), ok: Math.max(lk, rk) > 110, fix: '뒷다리를 더 뒤로 뻗어 자세를 넓히세요' },
      ]};
    },
    hint: '한 발을 앞으로 내딛어 무릎을 구부려주세요',
  },
  '사이드 런지': {
    check: (lms) => {
      const lk = calcAngle(lms[23], lms[25], lms[27]);
      const rk = calcAngle(lms[24], lms[26], lms[28]);
      const ok = lk < 120 || rk < 120;
      return { ok, angles: [
        { label: '왼쪽 무릎', value: lk, ok: lk < 120, fix: '왼쪽으로 더 넓게 벌려 무릎을 구부리세요' },
        { label: '오른쪽 무릎', value: rk, ok: rk < 120, fix: '오른쪽으로 더 넓게 벌려 무릎을 구부리세요' },
      ]};
    },
    hint: '옆으로 발을 넓게 벌리며 한쪽 무릎을 구부리세요',
  },
  '마운틴 클라이머': {
    check: (lms) => {
      const flat = Math.abs(lms[11].y - lms[23].y) < 0.18;
      const lk = calcAngle(lms[23], lms[25], lms[27]);
      const rk = calcAngle(lms[24], lms[26], lms[28]);
      const kneeUp = lk < 90 || rk < 90;
      return { ok: flat && kneeUp, angles: [
        { label: '왼쪽 무릎', value: lk, ok: lk < 90, fix: '왼쪽 무릎을 가슴 쪽으로 더 당기세요' },
        { label: '오른쪽 무릎', value: rk, ok: rk < 90, fix: '오른쪽 무릎을 가슴 쪽으로 더 당기세요' },
        { label: '몸통 수평', value: null, ok: flat, fix: '엉덩이를 내려 플랭크 자세를 유지하세요' },
      ]};
    },
    hint: '플랭크 자세에서 무릎을 가슴 쪽으로 당겨주세요',
  },
  '스텝업': {
    check: (lms) => {
      const lKneeUp = lms[25].y < lms[23].y - 0.1;
      const rKneeUp = lms[26].y < lms[24].y - 0.1;
      const ok = lKneeUp || rKneeUp;
      return { ok, angles: [
        { label: '왼쪽 무릎 들기', value: null, ok: lKneeUp, fix: '왼쪽 무릎을 엉덩이 높이 이상으로 들어올리세요' },
        { label: '오른쪽 무릎 들기', value: null, ok: rKneeUp, fix: '오른쪽 무릎을 엉덩이 높이 이상으로 들어올리세요' },
      ]};
    },
    hint: '한쪽 무릎을 엉덩이 높이 이상으로 들어주세요',
  },
  '힙 브릿지': {
    check: (lms) => {
      const hipUp = lms[23].y < lms[27].y - 0.08 && lms[24].y < lms[28].y - 0.08;
      const lh = calcAngle(lms[11], lms[23], lms[25]);
      const rh = calcAngle(lms[12], lms[24], lms[26]);
      const hipAngleOk = lh > 140 || rh > 140;
      const ok = hipUp && hipAngleOk;
      return { ok, angles: [
        { label: '엉덩이 들기', value: null, ok: hipUp, fix: '엉덩이를 천장 방향으로 더 높이 들어올리세요' },
        { label: '골반 각도', value: Math.max(lh, rh), ok: hipAngleOk, fix: '복근에 힘을 주며 골반을 더 올리세요' },
      ]};
    },
    hint: '등을 바닥에 대고 누워 엉덩이를 들어올리세요',
  },
  '버드독': {
    check: (lms) => {
      const armUp  = lms[15].y < lms[11].y - 0.05 || lms[16].y < lms[12].y - 0.05;
      const legUp  = lms[27].y < lms[23].y - 0.05 || lms[28].y < lms[24].y - 0.05;
      const ok = armUp && legUp;
      return { ok, angles: [
        { label: '팔 들기', value: null, ok: armUp, fix: '한쪽 팔을 앞으로 수평이 되도록 들어올리세요' },
        { label: '다리 들기', value: null, ok: legUp, fix: '반대쪽 다리를 뒤로 수평이 되도록 들어올리세요' },
      ]};
    },
    hint: '네 발 자세에서 반대쪽 팔·다리를 동시에 들어올리세요',
  },
  '복부 크런치': {
    check: (lms) => {
      const shoulderMidY = (lms[11].y + lms[12].y) / 2;
      const hipMidY      = (lms[23].y + lms[24].y) / 2;
      const crunch = shoulderMidY < hipMidY - 0.05;
      return { ok: crunch, angles: [
        { label: '상체 들기', value: null, ok: crunch, fix: '복근에 힘을 주며 어깨를 바닥에서 더 들어올리세요' },
      ]};
    },
    hint: '누운 자세에서 복근을 수축하며 상체를 들어올리세요',
  },
  '크로스 크런치': {
    check: (lms) => {
      const shoulderMidY = (lms[11].y + lms[12].y) / 2;
      const hipMidY      = (lms[23].y + lms[24].y) / 2;
      const tilt = Math.abs(lms[11].y - lms[12].y) > 0.04;
      const up   = shoulderMidY < hipMidY - 0.04;
      const ok   = up && tilt;
      return { ok, angles: [

/* ── 각도 표시 업데이트 ── */
function renderAngles(angles) {
  if (!angles.length) {
    angleDisplay.innerHTML = '<div style="color:#555;font-size:13px;text-align:center;padding:8px 0;">기본 자세 감지 모드</div>';
    return;
  }
  angleDisplay.innerHTML = angles.map(({ label, value, ok, fix }) => `
    <div class="angle-row">
      <span class="angle-label">${label}</span>
      <span class="angle-value ${ok ? 'ok' : ''}">${value !== null ? value + '°' : (ok ? '✓' : '✗')}</span>
    </div>
    ${!ok && fix ? `<div class="angle-fix">→ ${fix}</div>` : ''}`
  ).join('');
}

/* ── 4.6.4 측정 결과 로그 (성공 시 / 중지 시 공통 호출) ── */
function logMeasurement() {
  if (_frameLatencies.length === 0) return;
  const avg = arr => arr.reduce((a,b)=>a+b,0) / arr.length;
  console.log('=== 4.6.4 측정 결과 ===');
  console.log(`프레임 처리 지연(경고 반영 지연 대응): 평균 ${avg(_frameLatencies).toFixed(1)}ms, 샘플 ${_frameLatencies.length}개`);
  if (_holdDurations.length > 0) {
    console.log('홀드 판정 소요시간(30프레임=1초 가정 대비):', _holdDurations.map(d => (d/1000).toFixed(2) + '초'));
    console.log(`평균: ${(avg(_holdDurations)/1000).toFixed(2)}초 (가정값 1.00초 대비 오차 ${((avg(_holdDurations)/1000 - 1)*100).toFixed(1)}%)`);
  }
  if (_repDurations.length > 0) {
    console.log('렙 카운팅 완료 소요시간(시작~REQUIRED_REPS 도달):', _repDurations.map(d => (d/1000).toFixed(2) + '초'));
    console.log(`평균: ${(avg(_repDurations)/1000).toFixed(2)}초`);
  }
}

    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO', numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence:  0.5,
      minTrackingConfidence:      0.5,
    });
    drawingUtils = new DrawingUtils(ctx);
    modelStatus.textContent  = '💡 사용 방법';
    statusBar.textContent    = `${exerciseName} 자세를 준비해주세요. 분석 시작 버튼을 누르세요.`;
    btnStart.disabled        = false;
  } catch (err) {
    modelStatus.textContent = '⚠️ 모델 로드 실패';
    statusBar.textContent   = '오류: ' + err.message;
    statusBar.className     = 'status-bar error';
    console.error(err);
  }
}

/* ── 카메라 시작 ── */
btnStart.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    videoEl.srcObject = stream;
    await videoEl.play();
    btnStart.style.display = 'none';
    btnStop.style.display  = '';
    statusBar.textContent  = currentRule.hint;
    statusBar.className    = 'status-bar';
    /* 안내 텍스트 모드 표시 */
    const instrEl = document.getElementById('instrText');
    if (instrEl) {
      if (HOLD_EXERCISES.has(exerciseName) || !REP_RULES[exerciseName]) {
        instrEl.textContent = '1초간 유지';
      } else {
        instrEl.textContent = `${REQUIRED_REPS}회 반복`;
      }
    }
    _repStartTime = performance.now();
    requestAnimationFrame(detectLoop);
  } catch (err) {
    statusBar.textContent = '카메라 접근 실패: ' + err.message;
    statusBar.className   = 'status-bar error';
  }
});

/* ── 카메라 중지 ── */
btnStop.addEventListener('click', () => {
  if (animId) cancelAnimationFrame(animId);
  if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t => t.stop());
  videoEl.srcObject = null;
  btnStop.style.display  = 'none';
  btnStart.style.display = '';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  statusBar.textContent = '분석이 중지되었습니다.';
  statusBar.className   = 'status-bar';
  progressWrap.style.display = 'none';
  progressFill.style.width   = '0%';
  landmarkCount.textContent  = '-';
  correctFrames = 0;
  successShown  = false;
  repCount = 0;
  repPhase = 'up';
  renderAngles([]);
  logMeasurement();
});

/* ── 감지 루프 ── */
function detectLoop() {
  const _frameT0 = performance.now();
  animId = requestAnimationFrame(detectLoop);
  if (!poseLandmarker || videoEl.readyState < 2) return;

  if (canvas.width !== videoEl.videoWidth || canvas.height !== videoEl.videoHeight) {
    canvas.width  = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
  }

  const now = performance.now();
  if (videoEl.currentTime === lastVideoTime) return;
  lastVideoTime = videoEl.currentTime;

  const results = poseLandmarker.detectForVideo(videoEl, now);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.landmarks || results.landmarks.length === 0) {
    landmarkCount.textContent = '0';
    statusBar.textContent = '사람이 감지되지 않았습니다. 카메라 앞에 서주세요.';
    statusBar.className   = 'status-bar';
    correctFrames = 0;
    progressFill.style.width  = '0%';
    progressWrap.style.display = 'none';
    renderAngles([]);
    return;
  }

  const lms = results.landmarks[0];
  landmarkCount.textContent = lms.length;

  /* 스켈레톤 그리기 */
  drawingUtils.drawConnectors(lms, PoseLandmarker.POSE_CONNECTIONS, { color: '#FFFFFF', lineWidth: 2 });
  drawingUtils.drawLandmarks(lms, { radius: 4, color: '#00FF88', fillColor: '#00CC66' });

  /* 자세 검증 */
  if (successShown) return;
  const { ok, angles } = currentRule.check(lms);
  renderAngles(angles);

  const repRule = REP_RULES[exerciseName];
  const isHold  = HOLD_EXERCISES.has(exerciseName) || !repRule;

    if (isHold) {
    /* ── 홀드 모드 (플랭크·월 싯 등) ── */
    if (ok) {
      if (correctFrames === 0) _holdStartTime = performance.now();
      correctFrames++;
      const pct = Math.min(100, Math.round((correctFrames / CONFIRM_FRAMES) * 100));
      progressFill.style.width   = pct + '%';
      progressWrap.style.display = '';
      progressLabel.textContent  = `자세 유지 중... (${pct}%)`;
      statusBar.textContent = `자세 유지 중... (${pct}%)`;
      statusBar.className   = 'status-bar detected';
      if (correctFrames >= CONFIRM_FRAMES) {
        _holdDurations.push(performance.now() - _holdStartTime);
        successShown = true; showSuccess();
      }
    } else {
      correctFrames = 0;
      _holdStartTime = null;
      progressFill.style.width   = '0%';
      progressWrap.style.display = 'none';
      const failAngle = angles.find(a => !a.ok && a.fix);
      statusBar.textContent = failAngle ? `💡 ${failAngle.fix}` : currentRule.hint;
      statusBar.className   = 'status-bar';
    }
  } else {
    /* ── 렙 카운팅 모드 ── */
    if (repPhase === 'up' && repRule.down(lms)) {
      repPhase = 'down';
    } else if (repPhase === 'down' && repRule.up(lms)) {
      repPhase = 'up';
      repCount++;
    }

    const pct = Math.round((repCount / REQUIRED_REPS) * 100);
    progressFill.style.width   = pct + '%';
    progressWrap.style.display = '';
    progressLabel.textContent  = `${repCount} / ${REQUIRED_REPS}회 완료`;

    if (ok) {
      const guide = repPhase === 'up' ? '시작 자세입니다 ↓ 운동 자세로 내려가세요' : '잘 하고 있어요 ↑ 시작 자세로 돌아오세요';
      statusBar.textContent = `(${repCount}/${REQUIRED_REPS}) ${guide}`;
      statusBar.className   = 'status-bar detected';
    } else {
      const failAngle = angles.find(a => !a.ok && a.fix);
      statusBar.textContent = failAngle ? `💡 ${failAngle.fix}` : currentRule.hint;
      statusBar.className   = 'status-bar';
    }

    if (repCount >= REQUIRED_REPS) {
      _repDurations.push(performance.now() - _repStartTime);
      successShown = true; showSuccess();
    }
  }
    _frameLatencies.push(performance.now() - _frameT0);
}

initModel();
</script>
</body>
</html>
