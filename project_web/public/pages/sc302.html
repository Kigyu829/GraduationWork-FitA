<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 플랜 생성 중 – FitA</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sc301.css" />
  <link rel="stylesheet" href="../css/sc302.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="dashboard">

  <!-- ── 사이드바 (sc301과 동일 구조) ── -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo" id="sidebarLogo" style="cursor:pointer;">
        <div class="sidebar-logo-icon">🏃</div>
        <img src="../img/FitALogo.png" alt="FitA" style="height:26px;width:auto;object-fit:contain;" />
      </div>

      <div class="sidebar-card profile-card">
        <div class="profile-avatar" id="profileAvatar">👤</div>
        <div id="userName">내 정보</div>
        <div id="userBasicInfo">불러오는 중...</div>
        <div class="profile-weights">
          <div class="weight-chip">
            <span class="weight-chip-label">현재 체중</span>
            <span class="weight-chip-value" id="currentWeightText">-</span>
          </div>
          <div class="weight-chip">
            <span class="weight-chip-label">목표 체중</span>
            <span class="weight-chip-value" id="targetWeightText">-</span>
          </div>
        </div>
      </div>

      <div class="sidebar-card menu-card">
        <div class="menu-card-title">메뉴</div>
        <div class="menu-list">
          <button class="menu-btn" data-href="sc301.html"><span class="menu-btn-icon">🏠</span>대시보드</button>
          <button class="menu-btn" data-href="sc311.html"><span class="menu-btn-icon">💪</span>오늘의 식단/운동</button>
          <button class="menu-btn" id="menuHistory"><span class="menu-btn-icon">📅</span>히스토리</button>
          <button class="menu-btn" data-href="sc701.html"><span class="menu-btn-icon">⚙️</span>마이페이지</button>
        </div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </aside>

  <!-- ── 메인: 로딩 영역 ── -->
  <main class="main">

    <!-- 당일 플랜 이미 존재 시 표시 (기본 숨김) -->
    <div class="loading-card already-plan-card" id="alreadyPlanCard" style="display:none;">
      <div class="loading-character">✅</div>
      <div>
        <div class="loading-title">오늘은 이미 추천을 받았어요</div>
        <div class="loading-subtitle">
          변경을 원하신다면<br>AI 상담 기능을 이용해보세요.
        </div>
      </div>
      <div class="already-plan-btns">
        <button class="already-btn already-btn-secondary" id="btnBackToDash">
          🏠 대시보드로 돌아가기
        </button>
        <button class="already-btn already-btn-primary" id="btnOpenAiChat">
          🤖 AI 상담 받아보기
        </button>
      </div>
    </div>

    <div class="loading-card" id="loadingCard">

      <!-- 캐릭터 -->
      <div class="loading-character">🤖</div>

      <!-- 제목 -->
      <div>
        <div class="loading-title">AI가 플랜을 만들고 있어요</div>
        <div class="loading-subtitle">
          신체 정보와 목표를 분석해<br>맞춤형 식단과 운동을 준비 중이에요.
        </div>
      </div>

      <!-- 순환 메시지 -->
      <div class="loading-msg" id="loadingMsg">식단 패턴을 분석하고 있어요...</div>

      <!-- 막대 로딩바 -->
      <div class="loading-bar-wrap">
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loadingBar"></div>
        </div>
        <div class="loading-bar-label" id="loadingPct">잠시만 기다려 주세요</div>
      </div>

      <!-- 단계 표시 -->
      <div class="loading-steps">
        <div class="loading-step done" id="step1">
          <div class="step-dot"></div>신체 분석
        </div>
        <div class="step-sep"></div>
        <div class="loading-step active" id="step2">
          <div class="step-dot"></div>플랜 생성
        </div>
        <div class="step-sep"></div>
        <div class="loading-step" id="step3">
          <div class="step-dot"></div>최종 검토
        </div>
      </div>

    </div><!-- /loading-card -->
  </main>
</div>


  <!-- sc501: AI 상담 오버레이 -->
  <div class="ai-overlay" id="aiOverlay">
    <div class="ai-overlay-panel" id="aiOverlayPanel">
      <div class="ai-overlay-header">
        <div class="ai-overlay-title">🤖 AI 상담</div>
        <button class="ai-overlay-close" id="aiOverlayClose">×</button>
      </div>
      <div class="ai-overlay-messages" id="aiOverlayMessages">
        <div class="chat-msg ai">
          <div class="chat-avatar">🤖</div>
          <div>
            <div class="chat-bubble">안녕하세요! 식단이나 운동, 건강에 대해 궁금한 점을 편하게 물어보세요 😊</div>
            <div class="chat-time">AI 상담사</div>
          </div>
        </div>
      </div>
      <div class="ai-overlay-input-wrap">
        <textarea class="ai-overlay-input" id="aiOverlayInput" placeholder="질문을 입력하세요..." rows="1"></textarea>
        <button class="ai-overlay-send" id="aiOverlaySend">➤</button>
      </div>
    </div>
  </div>

  <!-- sc601: 히스토리 달력 모달 -->
  <div class="hist-modal-overlay" id="histModalOverlay">
    <div class="hist-modal" id="histModal">
      <div class="hist-modal-header">
        <div class="hist-modal-title">📅 히스토리</div>
        <button class="hist-modal-close" id="histModalClose">×</button>
      </div>
      <div class="hist-modal-body">
        <div class="hist-cal-nav">
          <button class="hist-cal-arrow" id="histPrevMonth">&#8249;</button>
          <span class="hist-cal-title" id="histCalTitle">-</span>
          <button class="hist-cal-arrow" id="histNextMonth">&#8250;</button>
        </div>
        <div class="hist-legend">
          <span class="hist-legend-item"><span class="hist-dot dot-both"></span>식단+운동</span>
          <span class="hist-legend-item"><span class="hist-dot dot-meal"></span>식단만</span>
          <span class="hist-legend-item"><span class="hist-dot dot-workout"></span>운동만</span>
        </div>
        <div class="hist-weekdays">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div class="hist-days" id="histDays"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/config.js"></script>
<script src="../js/sc302/utils.js"></script>
<script src="../js/sc302/api.js"></script>
<script src="../js/sc302/loading.js"></script>
<script src="../js/sc302/init.js"></script>
</body>
</html>
