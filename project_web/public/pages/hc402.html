<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식단 분석 중</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sc101.css" />
  <link rel="stylesheet" href="../css/drawer.css" />
  <link rel="stylesheet" href="../css/hc402.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- ── 네비게이션 바 ── -->
  <nav class="navbar">
    <div class="nav-inner">
      <button class="drawer-toggle-nav" id="drawerToggle" title="메뉴">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <a href="sc301.html" class="site-logo" id="navLogo">
        <div class="site-logo-icon">🏃</div>
        <img src="../img/FitALogo.png" alt="FitA" style="height:28px;width:auto;object-fit:contain;" />
      </a>
    </div>
  </nav>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo" id="drawerLogo" style="cursor:pointer;">
        <div class="drawer-logo-icon">🏃</div>
        <img src="../img/FitALogo.png" alt="FitA" style="height:26px;width:auto;object-fit:contain;" />
      </div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-menu-btn" data-href="sc301.html"><span>🏠</span>대시보드</button>
      <button class="drawer-menu-btn" data-href="sc311.html"><span>💪</span>오늘의 식단/운동</button>
      <button class="drawer-menu-btn" data-href="sc602.html"><span>📅</span>히스토리</button>
      <button class="drawer-menu-btn" data-href="sc701.html"><span>⚙️</span>마이페이지</button>
    </nav>
    <button class="drawer-logout" id="drawerLogout">로그아웃</button>
  </aside>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="scan-main">
    <div class="scan-card">
      <div class="scan-status" id="scanStatus">사진을 스캔하는 중...</div>
      <div class="scan-frame">
        <img class="scan-photo" id="scanPhoto" src="" alt="업로드된 사진" />
        <div class="scan-bar"></div>
        <div class="scan-overlay"></div>
      </div>
      <div class="scan-progress-wrap">
        <div class="scan-progress-bar">
          <div class="scan-progress-fill" id="progressFill"></div>
        </div>
        <div class="scan-progress-label" id="progressLabel">0%</div>
      </div>
      <div class="scan-hint" id="scanHint">AI가 음식의 종류와 양을 파악하고 있어요</div>
    </div>
  </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
<script src="../js/common.js"></script>
  <script src="../js/drawer.js"></script>
  <script src="../js/hc402.js"></script>
</body>
</html>
