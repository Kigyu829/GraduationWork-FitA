<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09131a">
  <title>오프라인 – FitA</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../css/common.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--bg, #09131a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      color: var(--text, #fff);
    }
    .offline-icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: 0.7;
    }
    .offline-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .offline-desc {
      font-size: 14px;
      color: var(--text-sec, rgba(255,255,255,0.6));
      line-height: 1.7;
      max-width: 320px;
      margin-bottom: 32px;
    }
    .offline-available {
      background: var(--surface, #1e2d3a);
      border: 1px solid var(--border, rgba(255,255,255,0.12));
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 28px;
      text-align: left;
    }
    .offline-available-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--teal, #66D0BC);
      margin-bottom: 12px;
    }
    .offline-feature {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-sec, rgba(255,255,255,0.6));
      padding: 6px 0;
    }
    .offline-feature span:first-child { font-size: 16px; }
    .offline-retry-btn {
      background: var(--teal, #66D0BC);
      color: #09131a;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    .offline-home-link {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-mute, rgba(255,255,255,0.35));
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-icon">📡</div>
  <div class="offline-title">인터넷에 연결되지 않았어요</div>
  <div class="offline-desc">
    네트워크 연결을 확인해주세요.<br>
    아래 기능은 오프라인에서도 이용할 수 있어요.
  </div>

  <div class="offline-available">
    <div class="offline-available-title">✅ 오프라인에서 가능한 기능</div>
    <div class="offline-feature"><span>🏠</span><span>홈 대시보드 보기</span></div>
    <div class="offline-feature"><span>📋</span><span>오늘의 식단 / 운동 플랜 보기</span></div>
    <div class="offline-feature"><span>✔️</span><span>식단 · 운동 체크 기록</span></div>
    <div class="offline-feature"><span>📅</span><span>과거 기록 조회</span></div>
    <div class="offline-feature"><span>👤</span><span>내 정보 · 체중 그래프</span></div>
  </div>

  <div class="offline-available" style="border-color:rgba(255,80,80,0.2);background:rgba(255,80,80,0.06);">
    <div class="offline-available-title" style="color:var(--red,#FF3B3B);">❌ 네트워크가 필요한 기능</div>
    <div class="offline-feature"><span>🤖</span><span>AI 플랜 생성</span></div>
    <div class="offline-feature"><span>📷</span><span>음식 사진 인증 (CNN)</span></div>
    <div class="offline-feature"><span>💬</span><span>AI 상담</span></div>
  </div>

  <button class="offline-retry-btn" onclick="location.reload()">다시 시도</button>
  <div class="offline-home-link" onclick="history.back()">이전 페이지로</div>
</body>
</html>
