<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09131a">
  <title>스캔 중 – FitA</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/hc402.css">
</head>
<body>
  <header class="mob-header">
    <button class="mob-header-back" onclick="history.back()">‹</button>
    <span class="mob-header-title">AI 분석 중</span>
    <div class="mob-header-right"></div>
  </header>

  <main class="mob-main-sub">
    <div class="mob-inner" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);">
      <div class="scan-card">
        <div class="scan-status" id="scanStatus">사진을 스캔하는 중...</div>
        <div class="scan-frame">
          <img class="scan-photo" id="scanPhoto" src="" alt="업로드된 사진">
          <div class="scan-bar"></div>
          <div class="scan-overlay"></div>
        </div>
        <div class="scan-progress-wrap">
          <div class="scan-progress-bar"><div class="scan-progress-fill" id="progressFill"></div></div>
          <div class="scan-progress-label" id="progressLabel">0%</div>
        </div>
        <div class="scan-hint" id="scanHint">AI가 음식의 종류와 양을 파악하고 있어요</div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/hc402.js"></script>
</body>
</html>
